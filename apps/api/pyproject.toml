[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deposit360-api"
version = "0.1.0"
description = "Deposit360 FDR lifecycle management API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]