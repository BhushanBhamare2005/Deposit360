services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deposit360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-deposit360}
    volumes:
      - deposit360_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deposit360} -d ${POSTGRES_DB:-deposit360}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deposit360}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deposit360}
      CORS_ORIGINS: http://localhost:8080
      STORAGE_LOCAL_PATH: /data/uploads
    volumes:
      - deposit360_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - api

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  deposit360_db:
  deposit360_uploads: