services:
  - type: web
    name: deposit360-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./infra/docker/Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_S3_ENDPOINT_URL
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: LIFECYCLE_SCHEDULER_ENABLED
        value: "true"
